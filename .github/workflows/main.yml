name: Build Windows Plugin

on:
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Compile and Link Plugin (.dll)
      shell: bash
      run: |
        mkdir -p bin
        
        # Используем предустановленный в Windows-раннер компилятор g++
        export PATH="/c/msys64/mingw32/bin:$PATH"
        
        echo "=== Сборка SDK ==="
        g++ -m32 -c -O2 -w -std=c++11 src/SDK/*.cpp -Isrc -Isrc/SDK
        
        echo "=== Сборка плагина ==="
        g++ -m32 -c -O2 -w -std=c++11 src/*.cpp -Isrc -Isrc/SDK
        
        echo "=== Линковка DLL ==="
        g++ -m32 -shared -O3 -o bin/DisableVehicleLimit.dll *.o
        
        rm *.o
        echo "=== Готово! ==="

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: samp-plugin-windows
        path: bin/DisableVehicleLimit.dll
