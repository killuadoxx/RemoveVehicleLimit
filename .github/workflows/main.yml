name: Build Windows Plugin

on:
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up MinGW (GCC for Windows)
      uses: egor-tensin/setup-mingw@v2
      with:
        platform: x86 # SAMP-плагины строго 32-битные

    - name: Compile and Link Plugin (.dll)
      run: |
        mkdir bin
        # 1. Компилируем исходники в объектные файлы .o (флаг -w скрывает предупреждения, как у автора)
        g++ -m32 -c -O2 -w -std=c++11 src/SDK/*.cpp -Isrc -Isrc/SDK
        g++ -m32 -c -O2 -w -std=c++11 src/*.cpp -Isrc -Isrc/SDK
        
        # 2. Линкуем все файлы .o в один готовый Windows плагин .dll
        g++ -m32 -shared -O3 -o bin/DisableVehicleLimit.dll *.o
        
        # 3. Очищаем лишний мусор
        rm *.o

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: samp-plugin-windows
        path: bin/DisableVehicleLimit.dll
